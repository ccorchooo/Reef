# Reef's kitty. Installed by `reef install` to ~/.config/kitty/kitty.conf (yours is
# backed up). Put your own changes in user.conf beside it: it's read last and never
# replaced.
#
# Colors and the background's transparency come from reef-colors.conf, which Reef writes
# from the current color scheme and reloads in every open kitty (Settings → Look → Apps:
# Color the terminal, Terminal opacity). Hyprland blurs what's behind the window.

# ── type ───────────────────────────────────────────────────────
# Google Sans Code, Reef's mono face (installed with Reef). Icons for the prompt and
# fastfetch come from kitty's built-in Nerd Font symbols.
font_family      family="Google Sans Code Monospace"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font      cell_height 112%
disable_ligatures cursor
text_composition_strategy legacy

# ── look ───────────────────────────────────────────────────────
background_opacity 0.86
dynamic_background_opacity yes
window_padding_width 10 14
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0
url_style curly
underline_hyperlinks hover

# The cursor: a soft beam that leaves a short trail as it jumps.
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_stop_blinking_after 10
cursor_trail 4
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 3

# Tabs as rounded pills along the bottom, like the bar's cays.
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{fmt.noitalic}{index} {title[:28]}"
active_tab_font_style bold
inactive_tab_font_style normal

# ── behavior ───────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 16
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
copy_on_select no
strip_trailing_spaces smart
mouse_hide_wait 3
shell_integration enabled
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
update_check_interval 0
wayland_titlebar_color background
linux_display_server auto

# ── keys ───────────────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n     new_os_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+a>m   set_background_opacity +0.05
map ctrl+shift+a>l   set_background_opacity -0.05
map ctrl+shift+a>d   set_background_opacity default

# ── Reef ───────────────────────────────────────────────────────
# Written by Reef (these glob includes skip files that don't exist yet).
globinclude reef-colors.conf
globinclude reef-shell.conf
# Yours, read last.
globinclude user.conf
