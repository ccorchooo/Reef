<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Island Coral chat</title><style>
@font-face{font-family:'Google Sans Flex';src:url('../../fonts/GoogleSansFlex-latin-full.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%}
@font-face{font-family:'Google Sans Code';src:url('../../fonts/GoogleSansCode-latin-wght.woff2') format('woff2');font-weight:300 800}
@font-face{font-family:'Material Symbols Rounded';src:url('../../fonts/material-symbols-rounded.woff2') format('woff2');font-weight:100 700}
</style>

<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;display:inline-block}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
button,input{font:inherit;border:0;padding:0;background:none;color:inherit}
button{cursor:pointer}
input::placeholder{color:#a8a8ad}
</style>
<style>html,body{margin:0;background:transparent}</style></head><body>

<div style="width: 880px; height: 460px; box-sizing: border-box; background: #130d0b; font-family: 'Google Sans Flex', system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; bottom: 16px; border-radius: 16px; background: #291d1a">
    <div style="height: 44px; border-bottom: 1px solid #554441"></div>
  </div>

  <section aria-label="Coral chat in the Island" style="position: absolute; left: 180px; top: 8px; width: 520px; border-radius: 28px; background: #000000; color: #ffffff; box-shadow: 0 6px 20px rgba(0,0,0,0.45); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

    <header style="display: flex; align-items: center; gap: 10px">
      <svg width="32" height="32" viewBox="0 0 24 24" role="img" aria-label="Coral">
        <circle cx="12" cy="12" r="11.5" fill="#f9b7a8" opacity="0.18"/>
        <path transform="translate(3.6 3.6) scale(0.7)" d="M12.0 2.4L12.8 2.3L13.8 2.1L14.7 1.8L15.8 1.6L16.8 1.6L17.8 2.0L18.6 2.6L19.1 3.5L19.5 4.5L19.7 5.5L20.0 6.4L20.3 7.2L20.8 7.9L21.5 8.5L22.2 9.3L22.9 10.1L23.4 11.0L23.6 12.0L23.4 13.0L22.9 13.9L22.2 14.7L21.5 15.5L20.8 16.1L20.3 16.8L20.0 17.6L19.7 18.5L19.5 19.5L19.1 20.5L18.6 21.4L17.8 22.0L16.8 22.4L15.8 22.4L14.7 22.2L13.8 21.9L12.8 21.7L12.0 21.6L11.2 21.7L10.2 21.9L9.3 22.2L8.2 22.4L7.2 22.4L6.2 22.0L5.4 21.4L4.9 20.5L4.5 19.5L4.3 18.5L4.0 17.6L3.7 16.8L3.2 16.1L2.5 15.5L1.8 14.7L1.1 13.9L0.6 13.0L0.4 12.0L0.6 11.0L1.1 10.1L1.8 9.3L2.5 8.5L3.2 7.9L3.7 7.2L4.0 6.4L4.3 5.5L4.5 4.5L4.9 3.5L5.4 2.6L6.2 2.0L7.2 1.6L8.2 1.6L9.3 1.8L10.2 2.1L11.2 2.3Z" fill="#f9b7a8"/>
      </svg>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 16px; line-height: 22px; font-weight: 700">Coral</span>
        <span style="font-family: 'Google Sans Code', monospace; font-size: 11px; line-height: 14px; color: #a8a8ad">[model name] · local</span>
      </div>
      <button type="button" aria-label="Switch to voice" style="width: 36px; height: 36px; border-radius: 9999px; background: #2c2c2e; display: flex; align-items: center; justify-content: center"><span class="ms">graphic_eq</span></button>
      <button type="button" aria-label="Close" style="width: 36px; height: 36px; border-radius: 9999px; background: #2c2c2e; display: flex; align-items: center; justify-content: center"><span class="ms">close</span></button>
    </header>

    <div style="align-self: flex-end; max-width: 340px; border-radius: 20px 20px 6px 20px; background: #2c2c2e; padding: 10px 14px; font-size: 14px; line-height: 20px">How do I make the bar neutral instead of tinted?</div>

    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 440px">
      <p style="margin: 0; font-size: 14px; line-height: 21px">Open Settings → Look and set Colorfulness to <strong style="font-weight: 700">Neutral</strong>. Surfaces turn gray and your wallpaper's accent stays for active things. I can switch it for you now.</p>
      <div style="display: flex; gap: 8px">
        <button type="button" style="height: 36px; border-radius: 9999px; background: #f9b7a8; color: #61342a; padding: 0 16px; font-size: 13px; font-weight: 600">Switch to Neutral</button>
        <button type="button" style="height: 36px; border-radius: 9999px; background: #2c2c2e; padding: 0 16px; font-size: 13px; font-weight: 500">Open Settings</button>
      </div>
    </div>

    <label style="height: 48px; border-radius: 9999px; background: #1c1c1e; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 18px">
      <input type="text" placeholder="Ask a follow-up…" aria-label="Ask Coral a follow-up" style="flex: 1; font-size: 14px; outline: none">
      <button type="button" aria-label="Speak" style="width: 36px; height: 36px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #a8a8ad"><span class="ms">mic</span></button>
      <button type="button" aria-label="Send" style="width: 36px; height: 36px; border-radius: 12px; background: #f9b7a8; color: #61342a; display: flex; align-items: center; justify-content: center"><span class="ms fill">arrow_upward</span></button>
    </label>

    <nav aria-label="Island tabs" style="display: flex; justify-content: center; gap: 4px">
      <button type="button" aria-label="Now" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">graphic_eq</span></button>
      <button type="button" aria-label="Shelf" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">inventory_2</span></button>
      <button type="button" aria-label="Clipboard" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">content_paste</span></button>
      <button type="button" aria-label="Tools" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">widgets</span></button>
      <button type="button" aria-label="Coral" aria-current="page" style="width: 44px; height: 28px; border-radius: 9999px; background: #2c2c2e; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: #f9b7a8"></span></button>
    </nav>
  </section>
</div>
</body></html>
