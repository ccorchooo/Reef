<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Island Tools tab</title><style>
@font-face{font-family:'Google Sans Flex';src:url('../../fonts/GoogleSansFlex-latin-full.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%}
@font-face{font-family:'Google Sans Code';src:url('../../fonts/GoogleSansCode-latin-wght.woff2') format('woff2');font-weight:300 800}
@font-face{font-family:'Material Symbols Rounded';src:url('../../fonts/material-symbols-rounded.woff2') format('woff2');font-weight:100 700}
</style>

<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;display:inline-block}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
button{font:inherit;border:0;padding:0;background:none;color:inherit;cursor:pointer}
</style>
<style>html,body{margin:0;background:transparent}</style></head><body>

<div style="width: 880px; height: 460px; box-sizing: border-box; background: #130d0b; font-family: 'Google Sans Flex', system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; bottom: 16px; border-radius: 16px; background: #291d1a">
    <div style="height: 44px; border-bottom: 1px solid #554441"></div>
  </div>

  <section aria-label="The Island, Tools tab" style="position: absolute; left: 230px; top: 8px; width: 420px; border-radius: 28px; background: #000000; color: #ffffff; box-shadow: 0 6px 20px rgba(0,0,0,0.45); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">

    <div role="tablist" aria-label="Tools" style="display: flex; gap: 4px; padding: 4px; border-radius: 9999px; background: #1c1c1e">
      <button type="button" role="tab" aria-selected="true" style="flex: 1; height: 32px; border-radius: 9999px; background: #f9b7a8; color: #61342a; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600"><span class="ms fill" style="font-size: 18px">calculate</span>Calculator</button>
      <button type="button" role="tab" aria-selected="false" aria-label="Emoji" style="width: 52px; height: 32px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">mood</span></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Color picker" style="width: 52px; height: 32px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">colorize</span></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Screenshot" style="width: 52px; height: 32px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">screenshot_region</span></button>
    </div>

    <div style="height: 64px; border-radius: 16px; background: #1c1c1e; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 16px">
      <span style="font-family: 'Google Sans Code', monospace; font-size: 13px; line-height: 18px; color: #a8a8ad">128 × 4.5</span>
      <span style="font-size: 28px; line-height: 32px; font-weight: 500; font-variant-numeric: tabular-nums">576</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 18px; font-weight: 500">
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">7</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">8</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">9</button>
      <button type="button" aria-label="Divide" style="height: 40px; border-radius: 9999px; background: #76453b; color: #ffdbd4">÷</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">4</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">5</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">6</button>
      <button type="button" aria-label="Multiply" style="height: 40px; border-radius: 14px; background: #f9b7a8; color: #61342a">×</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">1</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">2</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">3</button>
      <button type="button" aria-label="Subtract" style="height: 40px; border-radius: 9999px; background: #76453b; color: #ffdbd4">−</button>
      <button type="button" style="height: 40px; border-radius: 9999px; background: #2c2c2e">0</button>
      <button type="button" aria-label="Decimal point" style="height: 40px; border-radius: 9999px; background: #2c2c2e">.</button>
      <button type="button" aria-label="Equals" style="height: 40px; border-radius: 9999px; background: #fdd494; color: #644815">=</button>
      <button type="button" aria-label="Add" style="height: 40px; border-radius: 9999px; background: #76453b; color: #ffdbd4">+</button>
    </div>

    <nav aria-label="Island tabs" style="display: flex; justify-content: center; gap: 4px">
      <button type="button" aria-label="Now" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">graphic_eq</span></button>
      <button type="button" aria-label="Shelf" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">inventory_2</span></button>
      <button type="button" aria-label="Clipboard" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">content_paste</span></button>
      <button type="button" aria-label="Tools" aria-current="page" style="width: 44px; height: 28px; border-radius: 9999px; background: #2c2c2e; color: #f9b7a8; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px">widgets</span></button>
      <button type="button" aria-label="Coral" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #a8a8ad"></span></button>
    </nav>
  </section>
</div>
</body></html>
