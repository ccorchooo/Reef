<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Island at rest and live activities</title><style>
@font-face{font-family:'Google Sans Flex';src:url('../../fonts/GoogleSansFlex-latin-full.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%}
@font-face{font-family:'Google Sans Code';src:url('../../fonts/GoogleSansCode-latin-wght.woff2') format('woff2');font-weight:300 800}
@font-face{font-family:'Material Symbols Rounded';src:url('../../fonts/material-symbols-rounded.woff2') format('woff2');font-weight:100 700}
</style>

<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;display:inline-block}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
button{font:inherit;border:0;padding:0;background:none;color:inherit;cursor:pointer}
</style>
<style>html,body{margin:0;background:transparent}</style></head><body>

<div style="width: 880px; height: 460px; box-sizing: border-box; background: #130d0b; color: #f9e0db; font-family: 'Google Sans Flex', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center">

  <div style="margin-top: 8px; width: 120px; height: 32px; border-radius: 9999px; background: #000000" aria-label="The Island, resting"></div>

  <p style="margin: 40px 0 0; font-size: 11px; line-height: 16px; letter-spacing: 0.4px; font-weight: 500; color: #bca6a2; text-transform: uppercase">Live activities, collapsed</p>

  <div style="margin-top: 20px; display: flex; gap: 32px; align-items: flex-start">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="width: 180px; height: 32px; border-radius: 9999px; background: #000000; color: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 10px; box-sizing: border-box">
        <span class="ms fill" style="color: #f9b7a8; font-size: 18px">timer</span>
        <span style="font-family: 'Google Sans Code', monospace; font-size: 13px; color: #f9b7a8">04:12</span>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #bca6a2">Timer</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="width: 220px; height: 32px; border-radius: 9999px; background: #000000; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 6px; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.0 0.2L12.9 0.3L13.8 0.4L14.7 0.6L15.4 0.9L16.0 1.2L16.6 1.5L17.0 1.8L17.4 2.2L17.8 2.6L18.1 3.0L18.5 3.5L18.9 4.1L19.4 4.6L19.8 5.2L20.3 5.7L20.8 6.3L21.3 6.9L21.7 7.5L22.1 8.2L22.4 8.9L22.6 9.6L22.7 10.4L22.8 11.2L22.8 12.0L22.8 12.8L22.7 13.6L22.6 14.4L22.4 15.1L22.1 15.8L21.7 16.5L21.3 17.1L20.8 17.7L20.3 18.3L19.8 18.8L19.4 19.4L18.9 19.9L18.5 20.5L18.1 21.0L17.8 21.4L17.4 21.8L17.0 22.2L16.6 22.5L16.0 22.8L15.4 23.1L14.7 23.4L13.8 23.6L12.9 23.7L12.0 23.8L11.1 23.7L10.2 23.6L9.3 23.4L8.6 23.1L8.0 22.8L7.4 22.5L7.0 22.2L6.6 21.8L6.2 21.4L5.9 21.0L5.5 20.5L5.1 19.9L4.6 19.4L4.2 18.8L3.7 18.3L3.2 17.7L2.7 17.1L2.3 16.5L1.9 15.8L1.6 15.1L1.4 14.4L1.3 13.6L1.2 12.8L1.2 12.0L1.2 11.2L1.3 10.4L1.4 9.6L1.6 8.9L1.9 8.2L2.3 7.5L2.7 6.9L3.2 6.3L3.7 5.7L4.2 5.2L4.6 4.6L5.1 4.1L5.5 3.5L5.9 3.0L6.2 2.6L6.6 2.2L7.0 1.8L7.4 1.5L8.0 1.2L8.6 0.9L9.3 0.6L10.2 0.4L11.1 0.3Z" fill="#fdd494"/></svg>
        <div style="display: flex; align-items: center; gap: 3px; height: 16px" aria-hidden="true">
          <span style="width: 3px; height: 6px; border-radius: 2px; background: #f9b7a8"></span>
          <span style="width: 3px; height: 14px; border-radius: 2px; background: #f9b7a8"></span>
          <span style="width: 3px; height: 9px; border-radius: 2px; background: #f9b7a8"></span>
          <span style="width: 3px; height: 16px; border-radius: 2px; background: #f9b7a8"></span>
          <span style="width: 3px; height: 7px; border-radius: 2px; background: #f9b7a8"></span>
        </div>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #bca6a2">Media</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="width: 150px; height: 32px; border-radius: 9999px; background: #000000; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 12px; box-sizing: border-box">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #f97386"></span>
        <span style="font-family: 'Google Sans Code', monospace; font-size: 13px; color: #ffffff">00:37</span>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #bca6a2">Recording</span>
    </div>
  </div>

  <p style="margin: 36px 0 0; font-size: 11px; line-height: 16px; letter-spacing: 0.4px; font-weight: 500; color: #bca6a2; text-transform: uppercase">Hover peek</p>
  <div style="margin-top: 16px; width: 380px; height: 64px; border-radius: 28px; background: #000000; box-shadow: 0 6px 20px rgba(0,0,0,0.45); display: flex; align-items: center; gap: 12px; padding: 0 12px 0 10px; box-sizing: border-box; color: #ffffff">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #fdd494; display: flex; align-items: center; justify-content: center; color: #644815"><span class="ms fill" style="font-size: 22px">music_note</span></div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 14px; line-height: 20px; font-weight: 700">[Song title]</span>
      <span style="font-size: 12px; line-height: 16px; color: #a8a8ad">[Artist]</span>
    </div>
    <button type="button" aria-label="Pause" style="width: 40px; height: 40px; border-radius: 9999px; background: #f9b7a8; color: #61342a; display: flex; align-items: center; justify-content: center"><span class="ms fill">pause</span></button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 8px">
    <nav aria-label="Dock" style="height: 40px; border-radius: 9999px; background: #221715; box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 6px; padding: 0 8px">
      <span style="width: 28px; height: 28px; border-radius: 9px; background: #302220"></span>
      <span style="width: 28px; height: 28px; border-radius: 9px; background: #302220"></span>
      <span style="width: 28px; height: 28px; border-radius: 9px; background: #302220"></span>
      <span style="width: 28px; height: 28px; border-radius: 9px; background: #302220"></span>
    </nav>
    <nav aria-label="Navigator" style="height: 40px; border-radius: 9999px; background: #221715; box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 4px; padding: 0 6px">
      <button type="button" aria-label="Home" style="width: 32px; height: 32px; border-radius: 9999px; background: #76453b; display: flex; align-items: center; justify-content: center"><img src="../../logo/reef-mark-on-dark.svg" alt="" style="width: 20px; height: 20px"></button>
      <button type="button" aria-label="Search" style="width: 32px; height: 32px; border-radius: 9999px; color: #bca6a2; display: flex; align-items: center; justify-content: center"><span class="ms">search</span></button>
      <button type="button" aria-label="Workspaces" style="width: 32px; height: 32px; border-radius: 9999px; color: #bca6a2; display: flex; align-items: center; justify-content: center"><span class="ms">grid_view</span></button>
    </nav>
    <div style="height: 40px; border-radius: 9999px; background: #221715; box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 12px; font-weight: 500; color: #f9e0db">
      <span class="ms" style="color: #bca6a2; font-size: 18px">partly_cloudy_day</span>
      <span>Spotlight widget</span>
    </div>
    <div style="height: 40px; border-radius: 9999px; background: #221715; box-shadow: 0 2px 8px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 12px; font-weight: 500">
      <span>09:41</span>
      <span class="ms" style="color: #bca6a2; font-size: 18px">wifi</span>
      <span class="ms" style="color: #bca6a2; font-size: 18px">volume_up</span>
    </div>
  </div>
</div>
</body></html>
