<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Island Clipboard tab</title><style>
@font-face{font-family:'Google Sans Flex';src:url('../../fonts/GoogleSansFlex-latin-full.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%}
@font-face{font-family:'Google Sans Code';src:url('../../fonts/GoogleSansCode-latin-wght.woff2') format('woff2');font-weight:300 800}
@font-face{font-family:'Material Symbols Rounded';src:url('../../fonts/material-symbols-rounded.woff2') format('woff2');font-weight:100 700}
</style>

<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;display:inline-block}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
button,input{font:inherit;border:0;padding:0;background:none;color:inherit}
button{cursor:pointer}
input::placeholder{color:#a8a8ad}
</style>
<style>html,body{margin:0;background:transparent}</style></head><body>

<div style="width: 880px; height: 460px; box-sizing: border-box; background: #130d0b; font-family: 'Google Sans Flex', system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; bottom: 16px; border-radius: 16px; background: #291d1a">
    <div style="height: 44px; border-bottom: 1px solid #554441"></div>
  </div>

  <section aria-label="The Island, Clipboard tab" style="position: absolute; left: 180px; top: 8px; width: 520px; border-radius: 28px; background: #000000; color: #ffffff; box-shadow: 0 6px 20px rgba(0,0,0,0.45); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">

    <label style="height: 44px; border-radius: 9999px; background: #1c1c1e; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <span class="ms" style="color: #a8a8ad">search</span>
      <input type="text" placeholder="Search clipboard" aria-label="Search clipboard" style="flex: 1; font-size: 14px; outline: none">
      
    </label>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
      <li style="height: 44px; border-radius: 12px; background: #2c2c2e; display: flex; align-items: center; gap: 12px; padding: 0 12px">
        <span class="ms fill" style="color: #f9b7a8; font-size: 18px">push_pin</span>
        <span style="flex: 1; font-family: 'Google Sans Code', monospace; font-size: 13px">sudo pacman -Syu</span>
        <span style="font-size: 12px; color: #a8a8ad">Pinned</span>
      </li>
      <li style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px">
        <span style="width: 18px; height: 18px; border-radius: 6px; background: #e8735a"></span>
        <span style="flex: 1; font-family: 'Google Sans Code', monospace; font-size: 13px">#e8735a</span>
        <span style="font-size: 12px; color: #a8a8ad">2 min</span>
      </li>
      <li style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px">
        <span class="ms" style="color: #a8a8ad; font-size: 18px">image</span>
        <span style="flex: 1; font-size: 13px">Screenshot · 1920 × 1080</span>
        <span style="font-size: 12px; color: #a8a8ad">9 min</span>
      </li>
      <li style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px">
        <span class="ms" style="color: #a8a8ad; font-size: 18px">folder</span>
        <span style="flex: 1; font-family: 'Google Sans Code', monospace; font-size: 13px">~/Pictures/Wallpapers</span>
        <span style="font-size: 12px; color: #a8a8ad">1 h</span>
      </li>
      <li style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px">
        <span class="ms" style="color: #a8a8ad; font-size: 18px">notes</span>
        <span style="flex: 1; font-size: 13px">Meeting moved to Thursday</span>
        <span style="font-size: 12px; color: #a8a8ad">3 h</span>
      </li>
    </ul>

    <nav aria-label="Island tabs" style="display: flex; justify-content: center; gap: 4px">
      <button type="button" aria-label="Now" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">graphic_eq</span></button>
      <button type="button" aria-label="Shelf" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">inventory_2</span></button>
      <button type="button" aria-label="Clipboard" aria-current="page" style="width: 44px; height: 28px; border-radius: 9999px; background: #2c2c2e; color: #f9b7a8; display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 18px">content_paste</span></button>
      <button type="button" aria-label="Tools" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">widgets</span></button>
      <button type="button" aria-label="Coral" style="width: 44px; height: 28px; border-radius: 9999px; color: #a8a8ad; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #a8a8ad"></span></button>
    </nav>
  </section>
</div>
</body></html>
